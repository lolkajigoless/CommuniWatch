services:
  postgres:
    image: postgres:16-alpine
    container_name: communiwatch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: communiwatch
      POSTGRES_USER: communiwatch
      POSTGRES_PASSWORD: communiwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/communiwatch.sql:/docker-entrypoint-initdb.d/01-communiwatch.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U communiwatch -d communiwatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: communiwatch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: communiwatch-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run start"

  mobile:
    build:
      context: ./mobile
    container_name: communiwatch-mobile
    restart: unless-stopped
    working_dir: /app
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    depends_on:
      - backend
    volumes:
      - ./mobile:/app
      - /app/node_modules
    command: sh -c "npm install --legacy-peer-deps && npx expo start --clear"

volumes:
  pgdata:
